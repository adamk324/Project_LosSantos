plugins {
    id "com.android.application"
}

android {
    namespace "com.project.los_santos"
    compileSdk 35
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.project.los_santos"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DBUILD_ANDROID=ON", "-DBUILD_TESTING=OFF"
                cppFlags "-std=c++20"
                targets "native_lib"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }
}
